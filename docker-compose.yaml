services:
  2ez-dashboard:
    build: .
    container_name: 2ez-dashboard
    network_mode: host
    restart: unless-stopped
    stdin_open: true
    tty: true
    # The /terminal WebSocket nsenter's into PID 1's namespaces so the web
    # terminal is a real shell on the host, not the container's Alpine box.
    # That needs the host PID namespace, CAP_SYS_ADMIN/SYS_PTRACE/SYS_CHROOT
    # for setns(), and a seccomp profile that does not block setns.
    # Set TERMINAL_HOST=0 to drop back to a shell inside the container.
    pid: host
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - SYS_CHROOT
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    environment:
      DASHBOARD_ORIGINS: ${DASHBOARD_ORIGINS:-https://2ez.dinosaur-banana.ts.net,http://127.0.0.1:3080,http://localhost:3080}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      NAVIDROME_AUTH_PARAMS: ${NAVIDROME_AUTH_PARAMS:-}
      SPEEDTEST_API_TOKEN: ${SPEEDTEST_API_TOKEN:-}
      # Host user the terminal logs in as; root gets a plain `bash -l`.
      TERMINAL_USER: root
      FILE_BROWSER_SESSION_FILE: /var/lib/2ez-files/sessions.json
      FILE_BROWSER_BASE: ${FILE_BROWSER_BASE:-https://2ez.dinosaur-banana.ts.net:8084}
      UNMANIC_BASE: ${UNMANIC_BASE:-http://127.0.0.1:8888/unmanic}
      SONARR_BASE: ${SONARR_BASE:-http://127.0.0.1:8989/sonarr}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      RADARR_BASE: ${RADARR_BASE:-http://127.0.0.1:7878/radarr}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      QBT_BASE: ${QBT_BASE:-http://127.0.0.1:8080}
      QBT_USERNAME: ${QBT_USERNAME:-}
      QBT_PASSWORD: ${QBT_PASSWORD:-}
      STACKS_DIR: /opt/stacks
      STACK_HOST_ROOT: /host-root
    volumes:
      - file-browser-sessions:/var/lib/2ez-files
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host-root:ro
      # Match the host path so Compose resolves relative bind mounts correctly.
      - /opt/stacks:/opt/stacks

volumes:
  file-browser-sessions:
